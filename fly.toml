app = "serverfirebase"
primary_region = "cdg"

swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "node server.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
  
